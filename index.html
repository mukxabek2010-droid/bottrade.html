<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Steal an Egg 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; touch-action: none; }
        
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: white; font-size: 20px; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px;
            z-index: 10;
        }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; z-index: 20;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui">Tangalar: <span id="score">0</span> 🪙</div>
    <div id="joystick-zone"></div>

    <script>
        let score = 0;
        let hasEgg = false;
        let currentEgg = null;

        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0e0ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // 2. Map (Maydon)
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x7cfc00 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // O'yinchi Bazasi (Yashil Zona)
        const myBaseGeo = new THREE.BoxGeometry(8, 0.1, 8);
        const myBaseMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
        const myBase = new THREE.Mesh(myBaseGeo, myBaseMat);
        myBase.position.set(0, 0.05, 15);
        scene.add(myBase);

        // Dushman Bazasi (Qizil Zona)
        const enemyBaseMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const enemyBase = new THREE.Mesh(myBaseGeo, enemyBaseMat);
        enemyBase.position.set(0, 0.05, -15);
        scene.add(enemyBase);

        // 3. Player (O'yinchi)
        const playerGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0x3498db });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.75, 15); // O'z bazasida boshlaydi
        scene.add(player);

        camera.position.set(0, 12, 25);
        camera.lookAt(player.position);

        // 4. Tuxumlar Yaratish (Eggs)
        const eggs = [];
        const eggGeo = new THREE.SphereGeometry(0.5, 16, 16);
        eggGeo.scale(1, 1.4, 1); // Tuxum shakliga keltirish
        const eggMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.3, roughness: 0.2 });

        function spawnEgg(x, z) {
            const egg = new THREE.Mesh(eggGeo, eggMat);
            egg.position.set(x, 0.6, z);
            scene.add(egg);
            eggs.push(egg);
        }

        // Markazda va Dushman bazasida tuxum yaratish
        spawnEgg(0, 0);
        spawnEgg(0, -15);

        // 5. Joystik Boshqaruvi
        let moveVector = { x: 0, y: 0 };
        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '60px', bottom: '60px' },
            color: 'white'
        });

        manager.on('move', (evt, data) => {
            if (data.vector) {
                moveVector.x = data.vector.x;
                moveVector.y = data.vector.y;
            }
        });
        manager.on('end', () => { moveVector = { x: 0, y: 0 }; });

        // 6. O'yin Mantiqi & Animatsiya
        const speed = 0.15;

        function animate() {
            requestAnimationFrame(animate);

            // Harakatlanish
            if (moveVector.x !== 0 || moveVector.y !== 0) {
                player.position.x += moveVector.x * speed;
                player.position.z -= moveVector.y * speed;

                // Chegaralar
                player.position.x = Math.max(-18, Math.min(18, player.position.x));
                player.position.z = Math.max(-18, Math.min(18, player.position.z));

                // Kamera o'yinchi ortidan yuradi
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 10;
            }

            // Tuxumni ko'tarib yurish mantiqi
            if (hasEgg && currentEgg) {
                currentEgg.position.set(player.position.x, player.position.y + 1.2, player.position.z);
            } else {
                // Tuxumni o'g'irlash / Olish
                eggs.forEach((egg) => {
                    const dist = player.position.distanceTo(egg.position);
                    if (dist < 1.2 && !hasEgg) {
                        hasEgg = true;
                        currentEgg = egg;
                    }
                });
            }

            // Tuxumni o'z bazasiga topshirish
            if (hasEgg && player.position.distanceTo(myBase.position) < 3.5) {
                score += 100;
                document.getElementById('score').innerText = score;

                scene.remove(currentEgg);
                eggs.splice(eggs.indexOf(currentEgg), 1);
                hasEgg = false;
                currentEgg = null;

                // 3 soniyadan keyin yangi tuxum paydo bo'lishi
                setTimeout(() => spawnEgg(0, 0), 3000);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
