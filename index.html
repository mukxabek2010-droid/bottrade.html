<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Steal an Egg - Roblox Style V3</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: none; background: #87ceeb; }
        
        /* Roblox uslubidagi Yashil Dollar UI */
        #money-ui {
            position: absolute; bottom: 25px; left: 25px;
            background: linear-gradient(135deg, #15803d, #22c55e);
            color: #ffffff;
            padding: 12px 24px; border-radius: 16px; font-size: 22px;
            border: 3px solid #ffffff; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }

        #status-msg {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: #eab308; color: #000; padding: 10px 20px; border-radius: 14px;
            font-weight: bold; font-size: 16px; border: 2px solid #fff; display: none; z-index: 10;
        }

        /* Joystik chap tomonda */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; z-index: 20;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <div id="money-ui">💵 $<span id="score">0</span></div>
    <div id="status-msg">TUXUM O'G'IRLANDI! BAZANGGA CHOP!</div>
    <div id="joystick-zone"></div>

    <script>
        let score = 0;
        let carriedEgg = null;

        // 1. Scene & Camera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0e0ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 2. Map & Base
        const floorGeo = new THREE.BoxGeometry(40, 1, 40);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x4ade80 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.5;
        scene.add(floor);

        const myBase = new THREE.Mesh(
            new THREE.BoxGeometry(10, 0.2, 10),
            new THREE.MeshLambertMaterial({ color: 0x22c55e })
        );
        myBase.position.set(0, 0.1, 14);
        scene.add(myBase);

        // 3. Roblox R6 Personaj Yaratish
        const playerGroup = new THREE.Group();
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2563eb }));
        torso.position.y = 1.3;
        playerGroup.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
        head.position.y = 2.1;
        playerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.25, 0.68), new THREE.MeshLambertMaterial({ color: 0x451a03 }));
        hair.position.y = 2.45;
        playerGroup.add(hair);

        const armMat = new THREE.MeshLambertMaterial({ color: 0x2563eb });
        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), armMat);
        leftArm.position.set(-0.6, 1.25, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), armMat);
        rightArm.position.set(0.6, 1.25, 0);
        playerGroup.add(rightArm);

        const legMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
        leftLeg.position.set(-0.22, 0.45, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
        rightLeg.position.set(0.22, 0.45, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(0, 0, 14);
        scene.add(playerGroup);

        // 4. Egg System
        const eggs = [];
        const eggGeo = new THREE.SphereGeometry(0.6, 16, 16);
        eggGeo.scale(1, 1.3, 1);
        const eggMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.4, roughness: 0.2 });

        function createEgg(x, z) {
            const egg = new THREE.Mesh(eggGeo, eggMat);
            egg.position.set(x, 0.8, z);
            scene.add(egg);
            eggs.push(egg);
        }
        createEgg(0, 0);

        // 5. Joystick Control
        let moveAngle = null;
        let moveSpeed = 0;

        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '70px', bottom: '70px' },
            color: 'white', size: 110
        });

        manager.on('move', (evt, data) => {
            if (data.angle) {
                moveAngle = data.angle.radian;
                moveSpeed = Math.min(data.force, 1) * 0.18;
            }
        });
        manager.on('end', () => { moveSpeed = 0; moveAngle = null; });

        // 6. Sichqoncha / Teagish Bilan Kamerani Burish (Roblox Style Camera)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0; // Gorizontal burilish
        let cameraAngleY = 0.4; // Vertikal burilish
        const cameraDistance = 12;

        function onPointerDown(e) {
            // Joystik zonasidan tashqarida bosilganda kamerani burish
            if (e.clientX < 180 && e.clientY > window.innerHeight - 180) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (!clientX || !clientY) return;

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            cameraAngleX -= deltaX * 0.008; // Chap-o'ngga burish
            cameraAngleY += deltaY * 0.005; // Tepa-pastga burish

            // Kamera juda pastga yoki tepaga ketib qolmasligi uchun chegara
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.5, cameraAngleY));

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // Keyboard PC Support
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // 7. Game Loop & Walk Animation
        let animTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            let vx = 0, vz = 0;

            if (keys['KeyW'] || keys['ArrowUp']) vz -= 0.18;
            if (keys['KeyS'] || keys['ArrowDown']) vz += 0.18;
            if (keys['KeyA'] || keys['ArrowLeft']) vx -= 0.18;
            if (keys['KeyD'] || keys['ArrowRight']) vx += 0.18;

            // Joystik bo'yicha harakat
            if (moveAngle !== null && moveSpeed > 0) {
                // Kamera yo'nalishiga moslashgan holda yurish
                const moveDir = moveAngle + cameraAngleX + Math.PI / 2;
                vx = Math.cos(moveDir) * moveSpeed;
                vz = -Math.sin(moveDir) * moveSpeed;
            }

            if (vx !== 0 || vz !== 0) {
                playerGroup.position.x += vx;
                playerGroup.position.z += vz;

                playerGroup.position.x = Math.max(-18, Math.min(18, playerGroup.position.x));
                playerGroup.position.z = Math.max(-18, Math.min(18, playerGroup.position.z));

                playerGroup.rotation.y = Math.atan2(vx, vz);

                // Roblox Yurish Animatsiyasi
                animTime += 0.25;
                leftLeg.rotation.x = Math.sin(animTime) * 0.6;
                rightLeg.rotation.x = -Math.sin(animTime) * 0.6;
                leftArm.rotation.x = -Math.sin(animTime) * 0.6;
                rightArm.rotation.x = Math.sin(animTime) * 0.6;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
            }

            // Kamerani Roblox'dagidek burilgan burchak bo'yicha hisoblash va ergashishi
            camera.position.x = playerGroup.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = playerGroup.position.y + cameraDistance * Math.sin(cameraAngleY) + 1;
            camera.position.z = playerGroup.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            // Egg Pickup & Base Logic
            if (!carriedEgg) {
                for (let i = 0; i < eggs.length; i++) {
                    if (playerGroup.position.distanceTo(eggs[i].position) < 1.5) {
                        carriedEgg = eggs[i];
                        eggs.splice(i, 1);
                        document.getElementById('status-msg').style.display = 'block';
                        break;
                    }
                }
            } else {
                carriedEgg.position.set(playerGroup.position.x, playerGroup.position.y + 2.8, playerGroup.position.z);

                if (playerGroup.position.distanceTo(myBase.position) < 4) {
                    score += 250;
                    document.getElementById('score').innerText = score;
                    scene.remove(carriedEgg);
                    carriedEgg = null;
                    document.getElementById('status-msg').style.display = 'none';
                    setTimeout(() => createEgg(0, 0), 2000);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
