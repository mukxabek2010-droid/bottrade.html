<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox Style PvP Arena</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: none; background: #87ceeb; }
        
        #money-ui {
            position: absolute; bottom: 25px; left: 25px;
            background: linear-gradient(135deg, #15803d, #22c55e);
            color: #ffffff;
            padding: 12px 24px; border-radius: 16px; font-size: 22px;
            border: 3px solid #ffffff; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }

        #status-msg {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: #fff; padding: 10px 20px; border-radius: 14px;
            font-weight: bold; font-size: 16px; border: 2px solid #fff; display: none; z-index: 10;
        }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; z-index: 20;
        }

        #attack-btn {
            position: absolute; bottom: 40px; right: 40px;
            width: 80px; height: 80px; border-radius: 50%;
            background: #eab308; border: 4px solid #fff; color: #000;
            font-weight: bold; font-size: 18px; z-index: 20;
            display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <div id="money-ui">💵 $<span id="score">0</span></div>
    <div id="status-msg">QILICH OLINDI! PVP BOTGA HUJUM QIL!</div>
    <button id="attack-btn">URISH</button>
    <div id="joystick-zone"></div>

    <script>
        let score = 0;
        let hasSword = false;

        // 1. Scene & Camera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0e0ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 2. PvP Arena Map
        const floorGeo = new THREE.BoxGeometry(45, 1, 45);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.5;
        scene.add(floor);

        // Safe Zone (Yashil Baza)
        const myBase = new THREE.Mesh(
            new THREE.BoxGeometry(12, 0.2, 12),
            new THREE.MeshLambertMaterial({ color: 0x22c55e })
        );
        myBase.position.set(0, 0.1, 15);
        scene.add(myBase);

        // 3. Roblox R6 Player
        const playerGroup = new THREE.Group();
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2563eb }));
        torso.position.y = 1.3;
        playerGroup.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
        head.position.y = 2.1;
        playerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.25, 0.68), new THREE.MeshLambertMaterial({ color: 0x451a03 }));
        hair.position.y = 2.45;
        playerGroup.add(hair);

        const armMat = new THREE.MeshLambertMaterial({ color: 0x2563eb });
        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), armMat);
        leftArm.position.set(-0.6, 1.25, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), armMat);
        rightArm.position.set(0.6, 1.25, 0);
        playerGroup.add(rightArm);

        const legMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
        leftLeg.position.set(-0.22, 0.45, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
        rightLeg.position.set(0.22, 0.45, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(0, 0, 15);
        scene.add(playerGroup);

        // Qilich Modeli (Player qo'liga)
        const playerSword = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 1.5, 0.2),
            new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8 })
        );
        playerSword.position.set(0, -0.4, 0.3);
        playerSword.rotation.x = Math.PI / 3;
        playerSword.visible = false;
        rightArm.add(playerSword);

        // 4. Bazadagi Yerdagi Qilich (Pick up sword)
        const groundSword = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 2.0, 0.3),
            new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.9 })
        );
        groundSword.position.set(0, 1.2, 12);
        groundSword.rotation.z = Math.PI / 4;
        scene.add(groundSword);

        // 5. PvP Bot Enemy
        const botGroup = new THREE.Group();
        const botTorso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
        botTorso.position.y = 1.3;
        botGroup.add(botTorso);
        const botHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
        botHead.position.y = 2.1;
        botGroup.add(botHead);
        
        botGroup.position.set(0, 0, -5);
        scene.add(botGroup);

        // 6. Controls
        let moveAngle = null;
        let moveSpeed = 0;

        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '70px', bottom: '70px' },
            color: 'white', size: 110
        });

        manager.on('move', (evt, data) => {
            if (data.angle) {
                moveAngle = data.angle.radian;
                moveSpeed = Math.min(data.force, 1) * 0.18;
            }
        });
        manager.on('end', () => { moveSpeed = 0; moveAngle = null; });

        // Camera Drag Controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0;
        let cameraAngleY = 0.4;
        const cameraDistance = 12;

        function onPointerDown(e) {
            if (e.clientX < 180 && e.clientY > window.innerHeight - 180) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (!clientX || !clientY) return;

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            cameraAngleX -= deltaX * 0.008;
            cameraAngleY += deltaY * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.5, cameraAngleY));

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // Urish Tugmasi
        const attackBtn = document.getElementById('attack-btn');
        let isAttacking = false;

        attackBtn.addEventListener('click', () => {
            if (isAttacking) return;
            isAttacking = true;
            
            // Qilich siltash animatsiyasi
            rightArm.rotation.x = -Math.PI / 2;
            setTimeout(() => {
                rightArm.rotation.x = 0;
                isAttacking = false;
            }, 300);

            // Botga yaqin bo'lsa ziyon yetkazish
            if (playerGroup.position.distanceTo(botGroup.position) < 3.0) {
                score += 100;
                document.getElementById('score').innerText = score;
                botGroup.position.x = (Math.random() - 0.5) * 20;
                botGroup.position.z = (Math.random() - 0.5) * 20;
            }
        });

        // 7. Game Loop
        let animTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            let vx = 0, vz = 0;

            if (moveAngle !== null && moveSpeed > 0) {
                // Kamera yo'nalishiga qarab to'g'ri hisoblash
                const moveDir = moveAngle + cameraAngleX + Math.PI / 2;
                vx = Math.cos(moveDir) * moveSpeed;
                vz = -Math.sin(moveDir) * moveSpeed;
            }

            if (vx !== 0 || vz !== 0) {
                playerGroup.position.x += vx;
                playerGroup.position.z += vz;

                playerGroup.position.x = Math.max(-20, Math.min(20, playerGroup.position.x));
                playerGroup.position.z = Math.max(-20, Math.min(20, playerGroup.position.z));

                // PERSONAJNI ANIQ BURISH FIXI:
                playerGroup.rotation.y = Math.atan2(vx, vz);

                // Yurish animatsiyasi
                animTime += 0.25;
                leftLeg.rotation.x = Math.sin(animTime) * 0.6;
                rightLeg.rotation.x = -Math.sin(animTime) * 0.6;
                leftArm.rotation.x = -Math.sin(animTime) * 0.6;
                if (!isAttacking) rightArm.rotation.x = Math.sin(animTime) * 0.6;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                leftArm.rotation.x = 0;
                if (!isAttacking) rightArm.rotation.x = 0;
            }

            // Camera positioning
            camera.position.x = playerGroup.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = playerGroup.position.y + cameraDistance * Math.sin(cameraAngleY) + 1;
            camera.position.z = playerGroup.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            // Qilichni olish mantiqi
            if (!hasSword && playerGroup.position.distanceTo(groundSword.position) < 2.0) {
                hasSword = true;
                groundSword.visible = false;
                playerSword.visible = true;
                attackBtn.style.display = 'block';
                document.getElementById('status-msg').style.display = 'block';
            }

            // Yerdagi qilichni aylantirib turish
            if (groundSword.visible) {
                groundSword.rotation.y += 0.03;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
