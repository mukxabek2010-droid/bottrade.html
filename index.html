<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Craft 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            color: white; font-size: 24px; font-weight: bold;
            pointer-events: none; z-index: 10;
        }
        #instructions {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 12px; border-radius: 8px; z-index: 10;
        }
    </style>
    <!-- Three.js kutubxonalari -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="instructions">
        <b>Boshqaruv:</b><br>
        • Sichqonchani bosing — O'yinga kirish<br>
        • W, A, S, D — Yurish<br>
        • Chap tugma — Blokni buza olish<br>
        • O'ng tugma — Yangi blok qo'yish
    </div>

    <script>
        // 1. Sahnani sozlash
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Osmon rangi

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Yorug'lik
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 3. Blok teksturalari va obyektlar
        const blocks = [];
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); // Yashil yer rangi

        // 10x10 blokli yer maydonini avtomatik yaratish
        for (let x = -5; x < 5; x++) {
            for (let z = -5; z < 5; z++) {
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, 0, z);
                scene.add(cube);
                blocks.push(cube);
            }
        }

        // 4. Boshqaruv (Pointer Lock)
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        camera.position.set(0, 2, 5);

        const moveState = { forward: false, backward: false, left: false, right: false };
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.forward = true;
            if (e.code === 'KeyS') moveState.backward = true;
            if (e.code === 'KeyA') moveState.left = true;
            if (e.code === 'KeyD') moveState.right = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveState.forward = false;
            if (e.code === 'KeyS') moveState.backward = false;
            if (e.code === 'KeyA') moveState.left = false;
            if (e.code === 'KeyD') moveState.right = false;
        });

        // 5. Blok qo'yish va buzish (Raycasting)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) { // Chap tugma - Buzish
                    scene.remove(intersect.object);
                    blocks.splice(blocks.indexOf(intersect.object), 1);
                } else if (e.button === 2) { // O'ng tugma - Yangi blok qo'yish
                    const newCube = new THREE.Mesh(geometry, material);
                    newCube.position.copy(intersect.point).add(intersect.face.normal).floor().addScalar(0.5);
                    scene.add(newCube);
                    blocks.push(newCube);
                }
            }
        });

        // Kontekst menyuni o'chirish (o'ng tugma bosilganda sayt menyusi chiqmasligi uchun)
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 6. Animatsiya va yangilanish
        const speed = 0.1;
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                if (moveState.forward) controls.moveForward(speed);
                if (moveState.backward) controls.moveForward(-speed);
                if (moveState.left) controls.moveRight(-speed);
                if (moveState.right) controls.moveRight(speed);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Oyna hajmi o'zgarganda ekranni moslash
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
